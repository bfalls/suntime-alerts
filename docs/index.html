<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suntime Alerts</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ef;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #5b6472;
      --accent: #1f4e79;
      --border: #d9dfe7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #e7eef7 0%, var(--bg) 180px);
      color: var(--ink);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }
    p {
      line-height: 1.6;
      color: var(--muted);
    }
    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Suntime Alerts</h1>
      <p>Suntime Alerts is an early-stage alarm app focused on sunrise and sunset notifications.</p>
      <p>
        Privacy policy:
        <a href="./privacy/">View the privacy policy</a>
      </p>
    </section>
  </main>
</body>
</html>
